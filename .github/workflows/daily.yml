name: 毎日の判定

on:
  schedule:
    # 平日 18:10（日本時間）= 09:10 UTC。大引け(15:30)後、株価データが出そろってから実行
    - cron: "10 9 * * 1-5"
    # 土曜 10:10（日本時間）に監視銘柄を作り直し、学習サイクルを回す
    - cron: "10 1 * * 6"
  workflow_dispatch:
    inputs:
      refresh_universe:
        description: "監視銘柄も作り直す"
        type: boolean
        default: false
      learn:
        description: "学習サイクルも回す（約40分）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      HAS_JQUANTS: ${{ secrets.JQUANTS_API_KEY != '' }}   # キーの中身ではなく「登録済みか」だけを見る
    timeout-minutes: 240   # 初回だけ決算データの取得に約1時間半かかる
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: 監視銘柄を作り直す（土曜または手動指定時）
        if: github.event.schedule == '10 1 * * 6' || inputs.refresh_universe
        run: python -m src.refresh_universe

      # --- 週1回の学習サイクル: 10年分のデータで検証し直し、負けの原因を分析して改善案を採点する
      - name: 学習用の株価を取得（全上場銘柄・10年分）
        if: github.event.schedule == '10 1 * * 6' || inputs.learn
        run: python -m src.data --period 10y --tag bt

      - name: 取得した株価を手動実行のために保存
        if: github.event.schedule == '10 1 * * 6' || inputs.learn
        uses: actions/cache/save@v4
        with:
          path: data/cache/prices_bt.parquet
          key: prices-bt-${{ github.run_id }}

      - name: 検証（5基準の合否）
        if: github.event.schedule == '10 1 * * 6' || inputs.learn
        run: python -m src.research

      - name: 学習ループ（原因分析 → 改善案 → 採点 → 学習ノート）
        if: github.event.schedule == '10 1 * * 6' || inputs.learn
        run: python -m src.learn

      - name: 株価を取得（監視銘柄・2年分）
        run: python -m src.data --period 2y --tag daily

      # --- 割安株の候補づくり（J-QuantsのAPIキーがSecretsに登録されている場合のみ）
      #     決算データは公開リポジトリに含めず、Actionsのキャッシュにだけ置いて毎日の追加分だけ取得する
      - name: 保存済みの決算データを取り出す
        if: ${{ env.HAS_JQUANTS == 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: |
            data/cache/fins.parquet
            data/cache/fins_done.txt
          key: fins-${{ github.run_id }}
          restore-keys: fins-

      - name: 決算データの追加分を取得（初回だけ約1時間半）
        if: ${{ env.HAS_JQUANTS == 'true' }}
        continue-on-error: true   # 取得に失敗しても、前回までのデータで判定を続ける
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}   # キーはこの手順にだけ渡す
        run: python -m src.jquants

      - name: 決算データを次回のために保存
        if: ${{ always() && env.HAS_JQUANTS == 'true' && hashFiles('data/cache/fins.parquet') != '' }}
        uses: actions/cache/save@v4
        with:
          path: |
            data/cache/fins.parquet
            data/cache/fins_done.txt
          key: fins-${{ github.run_id }}

      - name: PBRの元データと株式分割の履歴を作る
        if: ${{ env.HAS_JQUANTS == 'true' && hashFiles('data/cache/fins.parquet') != '' }}
        run: |
          python -m src.fundamentals
          python -m src.splits

      - name: 判定とフォワードテストの更新
        run: python -m src.daily

      - name: 結果を保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data config
          git diff --cached --quiet || git commit -m "判定を更新 $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
