<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>スイングトレード判定</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#F2F4EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141A19" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="スイング判定">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Shippori+Mincho+B1:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F4EF; --sheet:#FBFCF9; --ink:#1D2A28; --sub:#59675F; --rule:#CFD8D0; --rule2:#93A598;
  --tint:#E5EBE3; --ai:#2B4C69; --up:#C2362C; --down:#1F7650; --caution:#9A6A0E;
  --ok:#1F7650; --ng:#B23A2E; --warn:#9A6A0E; --pass:#5B6672;
  --mincho:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --gothic:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI",Meiryo,system-ui,sans-serif;
}
:root{--line:var(--rule);--accent:var(--ai)}   /* グラフ描画が使う名前 */
@media (prefers-color-scheme: dark){
  :root{ --paper:#141A19; --sheet:#1A2120; --ink:#E3EAE5; --sub:#9DAAA2; --rule:#2E3936; --rule2:#53645C;
    --tint:#222B29; --ai:#8DB2D6; --up:#F0786B; --down:#5CC795; --caution:#E1B04F;
    --ok:#5CC795; --ng:#F0786B; --warn:#E1B04F; --pass:#A9B4C0; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.75 var(--gothic)}
a{color:var(--ai)}
:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
body>header{max-width:960px;margin:0 auto;padding:18px 16px 8px;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 16px}
h1{font:700 17px/1.4 var(--gothic);margin:0;letter-spacing:.04em}
.sub{color:var(--sub);font-size:13px}
nav{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--rule2)}
nav .in{display:flex;gap:2px;overflow-x:auto;max-width:960px;margin:0 auto;padding:0 12px;scrollbar-width:none}
nav button{flex:none;background:none;border:0;border-bottom:3px solid transparent;color:var(--sub);font:inherit;font-size:14px;padding:10px 10px 8px;cursor:pointer}
nav button:hover{color:var(--ink)}
nav button[aria-selected=true]{color:var(--ink);border-color:var(--ai);font-weight:700}
main{max-width:960px;margin:0 auto;padding:12px 16px 20px}
section{display:none} section.on{display:block}

/* 判定札：ページでいちばん目立たせる場所 */
.board{display:grid;grid-template-columns:auto 1fr;gap:4px 24px;align-items:center;padding:22px 4px 22px;--st:var(--pass)}
.board.ok{--st:var(--ai)} .board.warn{--st:var(--caution)}
.seal{width:92px;height:92px;border:3px solid var(--st);border-radius:6px;color:var(--st);display:grid;place-content:center;text-align:center;
  transform:rotate(-5deg);font-family:var(--mincho);line-height:1.2;box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 4px var(--st);
  animation:stamp .45s cubic-bezier(.2,.9,.3,1.3)}
.seal b{display:block;font-size:22px;font-weight:800}
.seal span{display:block;font-size:12px;font-weight:700;letter-spacing:.2em}
@keyframes stamp{from{transform:rotate(-5deg) scale(1.5);opacity:0}to{transform:rotate(-5deg) scale(1);opacity:1}}
@media (prefers-reduced-motion: reduce){.seal{animation:none}}
.vhead{font:800 clamp(26px,6vw,36px)/1.3 var(--mincho);margin:0;letter-spacing:.02em}
.vbody{margin:8px 0 0;max-width:40em;color:var(--sub)}
@media (max-width:520px){.board{grid-template-columns:1fr}.seal{width:76px;height:76px;margin-bottom:10px}.seal b{font-size:19px}}

/* 相場の状況（帳簿の1行） */
.ledger{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:3px double var(--rule2);border-bottom:1px solid var(--rule);margin:0 0 28px}
.ledger div{padding:10px 12px 9px;border-left:1px solid var(--rule)}
.ledger div:first-child{border-left:0;padding-left:4px}
.ledger b{display:block;font-size:20px;font-variant-numeric:tabular-nums;line-height:1.4}
.ledger div>span{font-size:12px;color:var(--sub);line-height:1.5}
@media (max-width:520px){.ledger div{padding:8px 8px 7px}.ledger b{font-size:17px}}

/* 共通の面 */
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:18px 18px 16px;margin-bottom:18px}
.card h2{font:700 19px/1.4 var(--mincho);margin:0 0 10px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.card h3{font-size:14px;margin:20px 0 6px}
.badge{font:700 12px/1.6 var(--gothic);padding:1px 9px;border-radius:3px;border:1px solid var(--rule2);color:var(--sub);white-space:nowrap}
.badge.ok{color:var(--ok);border-color:currentColor} .badge.ng{color:var(--ng);border-color:currentColor} .badge.warn{color:var(--warn);border-color:currentColor}
.verdict{font:800 18px/1.4 var(--mincho);margin:2px 0 6px}
.verdict.ok{color:var(--ok)} .verdict.ng{color:var(--ng)} .verdict.warn{color:var(--warn)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:7px 8px;border-bottom:1px solid var(--rule);text-align:right;white-space:nowrap}
th{color:var(--sub);font-weight:700;font-size:12px;border-bottom:3px double var(--rule2)}
th:first-child,td:first-child,td.l,th.l{text-align:left}
td.name{white-space:normal;min-width:9em;text-align:left}
.pos{color:var(--up)} .neg{color:var(--down)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));border-top:1px solid var(--rule);margin:12px 0}
.kpi{padding:9px 10px 8px;border-bottom:1px solid var(--rule)}
.kpi b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.kpi b small.amt{display:block;font-size:13px;line-height:1.4}
.kpi>span{font-size:12px;color:var(--sub)}
.note{font-size:13px;color:var(--sub);margin:8px 0 0;max-width:46em}
ul.plain{margin:6px 0;padding-left:1.2em} ul.plain li{margin:2px 0}
details summary{margin-top:10px}

/* 注文メモ：証券会社の注文画面に写す数字 */
.slips{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;margin-top:12px}
.slip{border:1px solid var(--rule2);border-radius:6px;background:var(--paper);position:relative}
.slip .hd{padding:10px 14px 8px;border-bottom:1px dashed var(--rule2)}
.slip .rk{position:absolute;top:12px;right:14px;font-size:12px;color:var(--sub)}
.slip .cd{font-size:24px;font-weight:700;letter-spacing:.06em;font-variant-numeric:tabular-nums;margin-right:6px}
.slip .nm{font-weight:700}
.slip .mk{display:block;font-size:12px;color:var(--sub)}
.slip dl{display:grid;grid-template-columns:1fr 1fr;margin:0;padding:6px 14px 10px;gap:0 12px}
.slip dl div{padding:5px 0;border-bottom:1px solid var(--rule)}
.slip dl div:nth-last-child(-n+2){border-bottom:0}
.slip dt{font-size:12px;color:var(--sub)}
.slip dd{margin:0;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.slip dd small{font-weight:400;font-size:12px;color:var(--sub);margin-left:4px}
.slip.off dl{opacity:.55}
.slip .why{padding:0 14px 10px;font-size:12px;color:var(--caution);font-weight:700}
.empty{margin:6px 0 0;color:var(--sub)}

form.h{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;align-items:end}
label{font-size:12px;color:var(--sub);display:block}
input,select,button.b{font:inherit;width:100%;padding:7px 9px;border:1px solid var(--rule2);border-radius:4px;background:var(--sheet);color:var(--ink)}
button.b{background:var(--ai);color:var(--sheet);border-color:var(--ai);cursor:pointer;font-weight:700}
a.b{background:var(--ai);color:var(--sheet);border-radius:4px;font-weight:700}
button.x{background:none;border:0;color:var(--sub);cursor:pointer;font-size:16px}
svg{width:100%;height:auto;display:block}

/* 銘柄の詳細（コードや銘柄名を押すと開く） */
button.stk{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit;
  text-decoration:underline;text-decoration-color:var(--rule2);text-underline-offset:3px}
button.stk:hover{text-decoration-color:var(--ai);color:var(--ai)}
dialog#stk{width:min(780px,100vw - 24px);max-height:calc(100vh - 24px);padding:0;border:1px solid var(--rule2);border-radius:8px;
  background:var(--sheet);color:var(--ink)}
dialog#stk::backdrop{background:rgba(20,28,26,.45)}
.sk-hd{position:sticky;top:0;background:var(--sheet);display:flex;gap:4px 14px;align-items:baseline;flex-wrap:wrap;
  padding:14px 18px 10px;border-bottom:3px double var(--rule2);z-index:1}
.sk-hd .cd{font-size:26px;font-weight:700;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.sk-hd .nm{font:700 19px/1.3 var(--mincho)}
.sk-hd .mk{color:var(--sub);font-size:12px}
.sk-hd .px{margin-left:auto;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.sk-hd .px small{font-size:13px;margin-left:6px}
.sk-x{position:absolute;top:10px;right:12px;font:inherit;font-size:13px;background:none;border:1px solid var(--rule2);border-radius:4px;
  color:var(--sub);padding:2px 10px;cursor:pointer}
.sk-hd{padding-right:84px}
.sk-bd{padding:12px 18px 18px}
.sk-read{font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums;min-height:1.6em}
.sk-leg{font-size:12px;color:var(--sub);display:flex;gap:4px 14px;flex-wrap:wrap;margin:4px 0 0}
.sk-leg i{display:inline-block;width:16px;height:0;border-top:2px solid;vertical-align:middle;margin-right:4px}
.sk-ind{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 18px;margin:14px 0 0;border-top:1px solid var(--rule)}
.sk-ind div{padding:8px 0 7px;border-bottom:1px solid var(--rule)}
.sk-ind dt{font-size:12px;color:var(--sub)}
.sk-ind dd{margin:0;font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.sk-ind dd small{display:block;font-weight:400;font-size:12px;color:var(--sub);line-height:1.5}
.sk-links{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:12px;font-size:13px}
footer{max-width:960px;margin:0 auto;padding:8px 16px 36px;color:var(--sub);font-size:12px;line-height:1.8}
</style>
</head>
<body>
<header>
  <h1>スイングトレード判定</h1>
  <div class="sub" id="asof">読み込み中…</div>
</header>
<nav><div class="in" role="tablist">
  <button data-t="today" aria-selected="true">今日の判定</button>
  <button data-t="hold">保有株の売り判定</button>
  <button data-t="fwd">フォワードテスト</button>
  <button data-t="bt">バックテスト</button>
  <button data-t="learn">学習</button>
  <button data-t="manual">手動実行</button>
  <button data-t="rule">ルール</button>
</div></nav>
<main>
  <section id="today" class="on"></section>
  <section id="hold"></section>
  <section id="fwd"></section>
  <section id="bt"></section>
  <section id="learn"></section>
  <section id="manual"></section>
  <section id="rule"></section>
</main>
<dialog id="stk" aria-labelledby="stk-t"></dialog>
<footer>
  このページは、あらかじめ決めたルールを機械的に当てはめた結果を表示するもので、利益を保証するものでも、個別の投資助言でもありません。
  株価データは Yahoo Finance 由来で、誤りや遅れを含むことがあります。売買の最終判断と発注はご自身で行ってください。
</footer>
<script>
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const yen = v => v == null ? "–" : Math.round(v).toLocaleString("ja-JP");
const px = v => v == null ? "–" : Number(v).toLocaleString("ja-JP", {maximumFractionDigits:1});
const pct = (v, d=2) => v == null ? "–" : `<span class="${v>0?"pos":v<0?"neg":""}">${v>0?"+":""}${Number(v).toFixed(d)}%</span>`;
const frac = (v, d=2) => v == null ? "–" : pct(v*100, d);
const syen = v => v == null ? "–" : `<span class="${v>0?"pos":v<0?"neg":""}">${v>0?"+":v<0?"−":""}${yen(Math.abs(v))}円</span>`;   // 損益の金額
const fracYen = (v, cap, d=1) => v == null ? "–" : `${frac(v, d)}<small class="amt">${syen(v * cap)}</small>`;          // ％と金額を並べる
let FROM_CACHE = false;   // 通信できず、前回保存した内容を表示しているか（sw.js が印を付ける）
const get = async f => { try { const r = await fetch(`data/${f}?t=${Date.now()}`);
  if (r.headers.get("x-from-cache")) { FROM_CACHE = true; showOffline(); }
  return r.ok ? r.json() : null; } catch { return null; } };
function showOffline(){ const a = document.getElementById("asof"); if (a && !a.textContent.includes("オフライン")) a.textContent += "（オフライン：前回の内容を表示中）"; }

document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav button").forEach(x => x.setAttribute("aria-selected", x === b));
  document.querySelectorAll("section").forEach(s => s.classList.toggle("on", s.id === b.dataset.t));
});

let T = null, V = null, Q = null, D = null, J = null, HY = null, M = null, PM = null;
const stageBadge = s => `<span class="badge ${s.adopted?"ok":"warn"}">${esc(s.stage || (s.adopted?"採用中":"検証中"))}${s.adopted?"":"（参考）"}</span>`;
const sidOf = s => s.id || s.name;

function ruleText(s){
  const p = s.params, e = s.exit, out = {buy:[], sell:[]};
  if (s.name === "pullback") {
    out.buy = ["株価が200日移動平均より上、かつ50日移動平均も200日移動平均より上（長期で上昇トレンド）",
               `2日RSIが${p.rsi_max}未満（短期的に強く売られた）`];
  } else if (s.name === "breakout") {
    out.buy = [`終値が過去${p.lookback}日の高値を更新`, `出来高が直近20日平均の${p.vol_mult}倍以上`,
               "株価が200日移動平均より上", "当日の上昇が+15%未満（上がり過ぎは見送り）"];
  } else if (s.name === "value") {
    out.buy = [`PBR（株価÷1株純資産）が${p.pbr_max}倍未満`,
               "株式分割があった銘柄は1株あたりの数字を補正し、それでも異常な値（配当利回り8%超など）の銘柄は除く",
               "すでに仮想保有中の銘柄は除き、条件に合う銘柄から偏りなく1日最大5銘柄を選ぶ（極端に低い銘柄への偏りを避けるため、順位は無作為）"];
  } else if (s.name === "gap_drift") {
    out.buy = [`前日終値より${(p.gap*100).toFixed(0)}%以上高く寄り付いた`, "始値より高く、その日の値幅の上側で引けた",
               `出来高が直近20日平均の${p.vol_mult}倍以上`];
  }
  for (const f of (s.filters_text || [])) out.buy.push(`【学習で追加した絞り込み】${f}`);
  if (p.regime) out.buy.push("TOPIX連動ETFが200日移動平均より上（市場全体が上昇基調）のときだけ買う");
  out.buy.push("条件を満たした日の翌営業日、寄り付きに成行で買う");
  out.sell.push(`損切り：買値から「ATR（1日の平均的な値幅）×${e.stop_atr}」下に逆指値を置く`);
  if (e.trail_atr) out.sell.push(`買った後の終値の最高値から「ATR×${e.trail_atr}」下へ、逆指値を毎日引き上げる（下げることはしない）`);
  if (e.exit_above_sma) out.sell.push(`終値が${e.exit_above_sma}日移動平均を上回ったら、翌営業日の寄り付きで売る`);
  out.sell.push(`${e.max_hold}営業日たっても売りの条件に当たらなければ、翌営業日の寄り付きで売る`);
  return out;
}

function renderToday(){
  const el = $("#today");
  if (!T) { el.innerHTML = `<div class="card">まだ判定データがありません。</div>`; return; }
  $("#asof").textContent = `${T.date} の大引け時点（更新 ${T.generated}）／資金 ${yen(T.capital)}円・最大${T.max_positions}銘柄`;
  const adopted = T.strategies.filter(s => s.adopted);
  const buyable = adopted.filter(s => s.candidates.some(c => c.affordable));
  let cls, head, body;
  if (!adopted.length) {
    cls = "ng"; head = "新規の買いは見送り";
    body = "バックテストの判定基準にすべて合格した戦略が、現時点ではありません。下に出ている銘柄は「検証中」の戦略による参考シグナルで、実際に買う根拠にはまだなりません。";
  } else if (!buyable.length) {
    cls = "warn"; head = "明日の買い候補なし";
    body = "採用中の戦略の条件を満たす銘柄が、今日はありませんでした。";
  } else {
    cls = "ok"; head = "明日の買い候補あり";
    body = "採用中の戦略が買いシグナルを出しています。順位の高い銘柄から、資金の範囲で検討してください。";
  }
  const seal = {ok:"買い", warn:"候補なし", ng:"見送り"}[cls];
  let h = `<div class="board ${cls}" role="status">
      <div class="seal" aria-hidden="true"><span>判定</span><b>${seal}</b><span>${esc(T.date.slice(5).replace("-", "/"))}</span></div>
      <div><p class="vhead">${head}</p><p class="vbody">${body}</p></div>
    </div>
    <div class="ledger">
      <div><b>${T.regime.up ? "上昇基調" : "下落基調"}</b><span>市場全体（TOPIXが200日平均より${T.regime.up?"上":"下"}）</span></div>
      <div><b>${pct(T.regime.ret20,1)}</b><span>TOPIX 直近20日の騰落</span></div>
      <div><b>${T.n_tradable}</b><span>予算内で買える銘柄数</span></div>
    </div>`;
  for (const s of T.strategies) {
    const blocked = s.regime_required && !T.regime.up;
    h += `<div class="card"><h2>${esc(s.label)} ${stageBadge(s)}
      <span class="badge">候補 ${s.n_candidates}銘柄</span></h2>`;
    if (s.forward_only) h += `<div class="note">10年分の検証ができていない、フォワードテスト専用の戦略です。14か月分の調査で有望と出たため、実際の相場で通用するかを記録しています。決算データは約3か月遅れのものを使っています${s.cand_date ? `（候補は ${esc(s.cand_date)} 時点）` : ""}。</div>`;
    if (!s.candidates.length) {
      h += `<p class="empty">${blocked ? "市場全体が下落基調のため、この戦略は買いを出しません。" : "今日は条件を満たす銘柄がありません。"}</p>`;
    } else {
      h += `<div class="slips">` + s.candidates.map(c => `<article class="slip${c.affordable ? "" : " off"}">
        <div class="hd"><span class="rk">${c.rank}位</span>${stk(c.code, `<span class="cd">${esc(c.code)}</span><span class="nm">${esc(c.name)}</span>`, {stop: c.stop})}
          <span class="mk">${esc(c.market)}・${esc(c.sector)}</span></div>
        <dl>
          <div><dt>終値</dt><dd>${px(c.close)}<small>${pct(c.ret1,1)}</small></dd></div>
          <div><dt>株数</dt><dd>${c.affordable ? `${c.shares}株` : "–"}</dd></div>
          <div><dt>逆指値の目安</dt><dd>${px(c.stop)}<small>${esc(c.stop_pct)}%</small></dd></div>
          <div><dt>必要資金の目安</dt><dd>${c.affordable ? yen(c.amount)+"円" : "–"}</dd></div>

function chart(curve, bench){
  if (!curve || curve.length < 2) return "";
  const W = 720, H = 240, L = 8, R = 8, Tp = 10, B = 22;
  const all = curve.map(d => d[1]).concat(bench.map(d => d[1]));
  const lo = Math.min(...all), hi = Math.max(...all);
  const t0 = Date.parse(curve[0][0]), t1 = Date.parse(curve.at(-1)[0]);
  const X = d => L + (Date.parse(d) - t0) / (t1 - t0 || 1) * (W - L - R);
  const Y = v => Tp + (hi - v) / (hi - lo || 1) * (H - Tp - B);
  const line = a => a.map(d => `${X(d[0]).toFixed(1)},${Y(d[1]).toFixed(1)}`).join(" ");
  const y0 = +curve[0][0].slice(0,4), y1 = +curve.at(-1)[0].slice(0,4);
  let ticks = "";
  for (let y = y0 + 1; y <= y1; y++) { const x = X(`${y}-01-01`); ticks += `<line x1="${x}" x2="${x}" y1="${Tp}" y2="${H-B}" stroke="var(--line)"/><text x="${x+3}" y="${H-6}" font-size="11" fill="var(--sub)">${y}</text>`; }
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="資産推移">${ticks}
    <polyline fill="none" stroke="var(--sub)" stroke-width="1.5" stroke-dasharray="4 3" points="${line(bench)}"/>
    <polyline fill="none" stroke="var(--accent)" stroke-width="2" points="${line(curve)}"/></svg>
    <div class="note"><span style="color:var(--accent)">━</span> この戦略（${yen(curve.at(-1)[1])}円）　<span>┅</span> 同じ金額でTOPIX連動ETFを持ち続けた場合（${yen(bench.at(-1)[1])}円）</div>`;
}

}

/* ---- 保有株（このブラウザの中だけに保存。外部には送信しない） ---- */
const KEY = "swing_holdings_v1";
const loadH = () => { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } };
const saveH = a => { try { localStorage.setItem(KEY, JSON.stringify(a)); } catch {} };

function judge(hd){
  const s = T && T.strategies.find(x => sidOf(x) === hd.strat || x.name === hd.strat);
  const q = Q && Q.q[hd.code];
  if (!s || !q) return {msg:"この銘柄のデータがありません（監視対象外）", cls:"warn"};
  const e = s.exit;
  let idx = Q.dates.findIndex(d => d >= hd.date);
  const tooOld = hd.date < Q.dates[0];
  if (idx < 0) return {name:q.n, msg:"買った日以降のデータがまだありません", cls:""};
  const cl = q.c.slice(idx).filter(v => v != null);
  const last = cl.at(-1), held = tooOld ? 999 : cl.length;
  const hi = Math.max(hd.price, ...cl);
  let stop = hd.price - e.stop_atr * q.a;
  if (e.trail_atr) stop = Math.max(stop, hi - e.trail_atr * q.a);
  const pl = (last / hd.price - 1) * 100;
  const base = {name:q.n, last, stop, pl, held, yen:(last - hd.price) * hd.shares};
  if (last <= stop) return {...base, msg:"逆指値を割り込み：まだ持っているなら明日の寄りで売り", cls:"ng"};
  if (e.exit_above_sma && q.s5 != null && last > q.s5) return {...base, msg:"反発を確認：明日の寄りで売り", cls:"ng"};
  if (held >= e.max_hold) return {...base, msg:"保有期限に到達：明日の寄りで売り", cls:"ng"};
  return {...base, msg:`保有継続（逆指値を ${px(Math.floor(stop))}円 に置く／期限まであと${e.max_hold - held}営業日）`, cls:"ok"};
}

        <td class="l"><b class="badge ${j.cls}">${esc(j.msg)}</b></td><td><button class="x" data-i="${i}" title="削除">✕</button></td></tr>`; });
    h += `</table></div><div class="note">逆指値は「買値 − ATR×倍率」を初期値とし、終値の最高値に合わせて引き上げた目安です。売ったら ✕ で削除してください。</div>`;

/* ---- 銘柄の詳細：チャート（ローソク足・移動平均・出来高）とテクニカル指標 ---- */
let CH = null;
const stk = (code, label, ctx = {}) => `<button type="button" class="stk" data-code="${esc(code)}"${
  ctx.entry ? ` data-entry="${esc(ctx.entry)}"` : ""}${ctx.stop ? ` data-stop="${esc(ctx.stop)}"` : ""}>${label}</button>`;
const num = (v, d = 0) => v == null ? "–" : Number(v).toLocaleString("ja-JP", {minimumFractionDigits: d, maximumFractionDigits: d});

function candleSvg(dates, d, lines, W = 720){
  const n = dates.length, PH = W < 500 ? 210 : 250, VH = 64, G = 14, L = 6, R = 52, T = 8;
  const H = T + PH + G + VH + 20;
  const vals = [...d.h, ...d.l, ...lines.map(x => x.v)].filter(v => v != null);
  let lo = Math.min(...vals), hi = Math.max(...vals); const pad = (hi - lo) * .06 || hi * .02; lo -= pad; hi += pad;
  const bw = (W - L - R) / n, X = i => L + bw * (i + .5), Y = v => T + (hi - v) / (hi - lo) * PH;
  const vmax = Math.max(...d.v.filter(v => v != null), 1), VY = v => T + PH + G + VH - (v / vmax) * VH;
  let g = "";
  for (let k = 0; k <= 4; k++) { const v = lo + (hi - lo) * k / 4, y = Y(v);
    g += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="var(--rule)"/><text x="${W - R + 6}" y="${y + 4}" font-size="11" fill="var(--sub)">${num(v, hi - lo < 30 ? 1 : 0)}</text>`; }
  let prevM = dates[0].slice(5, 7);
  dates.forEach((dt, i) => { const m = dt.slice(5, 7); if (m !== prevM) { const x = L + bw * i;
    g += `<line x1="${x}" x2="${x}" y1="${T}" y2="${T + PH + G + VH}" stroke="var(--rule)"/><text x="${x + 3}" y="${H - 4}" font-size="11" fill="var(--sub)">${+m}月</text>`; prevM = m; } });
  let c = "";
  for (let i = 0; i < n; i++) {
    const o = d.o[i], h = d.h[i], l = d.l[i], cl = d.c[i];
    if (cl != null && d.v[i] != null) c += `<rect x="${X(i) - bw * .35}" y="${VY(d.v[i])}" width="${bw * .7}" height="${T + PH + G + VH - VY(d.v[i])}" fill="var(--rule2)" opacity=".55"/>`;
    if (d.line || [o, h, l, cl].some(v => v == null)) continue;
    const col = cl >= o ? "var(--up)" : "var(--down)", y1 = Y(Math.max(o, cl)), y2 = Y(Math.min(o, cl));
    c += `<line x1="${X(i)}" x2="${X(i)}" y1="${Y(h)}" y2="${Y(l)}" stroke="${col}"/><rect x="${X(i) - bw * .35}" y="${y1}" width="${bw * .7}" height="${Math.max(y2 - y1, 1)}" fill="${col}"/>`;
  }
  const path = a => a.map((v, i) => v == null ? null : `${X(i).toFixed(1)},${Y(v).toFixed(1)}`).filter(Boolean).join(" ");
  const ma = d.line ? `<polyline fill="none" stroke="var(--ink)" stroke-width="1.5" points="${path(d.c)}"/>` : `<polyline fill="none" stroke="var(--ai)" stroke-width="1.5" points="${path(d.s25)}"/><polyline fill="none" stroke="var(--caution)" stroke-width="1.5" points="${path(d.s75)}"/>`;
  const hl = lines.map(x => `<line x1="${L}" x2="${W - R}" y1="${Y(x.v)}" y2="${Y(x.v)}" stroke="${x.col}" stroke-dasharray="5 4"/><text x="${L + 4}" y="${Y(x.v) - 4}" font-size="11" fill="${x.col}">${x.label} ${num(x.v, 1)}</text>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="直近${n}営業日の株価チャート" data-bw="${bw}" data-l="${L}" data-w="${W}">${g}${c}${ma}${hl}
    <line class="cur" x1="0" x2="0" y1="${T}" y2="${T + PH + G + VH}" stroke="var(--sub)" stroke-dasharray="2 3" visibility="hidden"/></svg>`;
}

function indicators(q, cols){
  const k = Object.fromEntries(cols.map((c, i) => [c, q.k ? q.k[i] : null])), c = q.c.at(-1);
  const rel = m => m == null ? "–" : `${c >= m ? "上" : "下"}（${c / m >= 1 ? "+" : ""}${((c / m - 1) * 100).toFixed(1)}%）`;
  const above = ["sma25", "sma75", "sma200"].filter(x => k[x] != null);
  const nUp = above.filter(x => c >= k[x]).length;
  const trend = !above.length ? "" : nUp === above.length ? "25日・75日・200日の平均すべての上：上昇トレンドとされる形"
    : nUp === 0 ? "25日・75日・200日の平均すべての下：下降トレンドとされる形" : "平均線の上下が入り混じる：方向感がはっきりしない形";
  const cross = x => !x ? "" : x > 0 ? `${x}日前に上抜け` : `${-x}日前に下抜け`;
  const it = [
    ["5日移動平均", num(k.sma5, 1), `株価はこの${rel(k.sma5)}`],
    ["25日移動平均", num(k.sma25, 1), `株価はこの${rel(k.sma25)}`],
    ["75日移動平均", num(k.sma75, 1), `株価はこの${rel(k.sma75)}`],
    ["200日移動平均", num(k.sma200, 1), trend || `株価はこの${rel(k.sma200)}`],
    ["25日と75日の平均の交差", k.ma_x ? (k.ma_x > 0 ? "ゴールデンクロス" : "デッドクロス") : "直近20日はなし",
      k.ma_x ? `${cross(k.ma_x)}。上抜けは上昇、下抜けは下落の始まりの合図とされる` : "短期と長期の平均の上下関係が続いている"],
    ["RSI（14日）", num(k.rsi14, 0), k.rsi14 == null ? "" : k.rsi14 >= 70 ? "70以上：買われすぎとされる水準" : k.rsi14 <= 30 ? "30以下：売られすぎとされる水準" : "30〜70：どちらでもない水準"],
    ["MACDヒストグラム", k.macd == null ? "–" : `${k.macd > 0 ? "+" : ""}${k.macd.toFixed(2)}%`,
      (k.macd == null ? "" : k.macd > 0 ? "プラス：上向きの勢いとされる" : "マイナス：下向きの勢いとされる") + (k.macd_x ? `（シグナル線を${cross(k.macd_x)}）` : "")],
    ["ボリンジャーバンド内の位置", k.bb == null ? "–" : `${k.bb > 0 ? "+" : ""}${k.bb.toFixed(2)}`,
      k.bb == null ? "" : k.bb >= 1 ? "上の線（+2σ）を超えている：行き過ぎとされる" : k.bb <= -1 ? "下の線（−2σ）を割っている：行き過ぎとされる" : "+1が上の線、−1が下の線、0が20日平均"],
    ["52週高値からの距離", k.hi52 == null ? "–" : `${k.hi52.toFixed(1)}%`, k.hi52 == null ? "" : k.hi52 > -3 ? "高値圏" : "0に近いほど高値圏"],
    ["出来高倍率", k.vol == null ? "–" : `${k.vol.toFixed(1)}倍`, "当日の出来高 ÷ 直近20日の平均"],
    ["値動きの大きさ", k.atr_pct == null ? "–" : `${k.atr_pct.toFixed(1)}%`, "1日の平均的な値幅（ATR）÷ 株価。逆指値の幅の目安になる"],
  ];
  return `<dl class="sk-ind">${it.map(([t, v, r]) => `<div><dt>${esc(t)}</dt><dd>${esc(v)}<small>${esc(r)}</small></dd></div>`).join("")}</dl>`;
}

async function openStock(code, ctx){
  const dlg = $("#stk");
  if (!CH) CH = await get("charts.json") || {dates: [], s: {}};
  const q = Q && Q.q[code], d = CH.s[code];
  const name = q ? q.n : code, last = q ? q.c.at(-1) : (d ? d.c.at(-1) : null), prev = q ? q.c.at(-2) : null;
  const lines = [];
  if (ctx.entry) lines.push({v: ctx.entry, label: "買値", col: "var(--ink)"});
  if (ctx.stop) lines.push({v: ctx.stop, label: "逆指値", col: "var(--caution)"});
  let chart = "", dates = [], src = null;
  const W = Math.round(Math.min(720, Math.max(320, innerWidth - 70)));   // 画面幅に合わせて描く（縮小で文字が潰れないように）
  if (d) { dates = CH.dates; src = d; chart = candleSvg(dates, d, lines, W); }
  else if (q) { dates = Q.dates; src = {o: q.c, h: q.c, l: q.c, c: q.c, v: q.c.map(() => null), s25: [], s75: [], line: true}; chart = candleSvg(dates, src, lines, W); }
  dlg.innerHTML = `<div class="sk-hd"><span class="cd">${esc(code)}</span><span class="nm" id="stk-t">${esc(name)}</span>
      ${q ? `<span class="mk">${esc(q.m || "")}${q.g ? "・" + esc(q.g) : ""}</span>` : ""}
      <span class="px">${num(last, 1)}<small>${last != null && prev ? pct((last / prev - 1) * 100, 1) : ""}</small></span>
      <button type="button" class="sk-x" aria-label="閉じる">閉じる</button></div>
    <div class="sk-bd">
      ${chart ? `<div class="sk-read" aria-live="polite"></div>${chart}
        <div class="sk-leg">${d ? `<span><i style="color:var(--up)"></i>陽線（上げた日）</span><span><i style="color:var(--down)"></i>陰線（下げた日）</span><span><i style="color:var(--ai)"></i>25日移動平均</span><span><i style="color:var(--caution)"></i>75日移動平均</span><span>下段は出来高</span>` : `<span>直近${dates.length}営業日の終値（ローソク足は、画面に出ている銘柄だけ用意しています）</span>`}</div>`
        : `<p class="note">この銘柄の株価データはありません（監視対象外）。</p>`}
      ${q && Q.cols ? `<h3>テクニカル指標（${esc(Q.dates.at(-1))} 終値時点）</h3>${indicators(q, Q.cols)}` : ""}
      <p class="note">読み取りは各指標の一般的な見方です。このシステムの10年分の検証では、これらの指標だけで市場平均を上回る力は確認できていません。判断材料の一つとして見てください。</p>
      <div class="sk-links">PER・PBRなどの業績指標と適時開示は外部サイトで：
        <a href="https://kabutan.jp/stock/?code=${encodeURIComponent(code)}" target="_blank" rel="noopener">株探</a>
        <a href="https://finance.yahoo.co.jp/quote/${encodeURIComponent(code)}.T" target="_blank" rel="noopener">Yahoo!ファイナンス</a></div>
    </div>`;
  const svg = dlg.querySelector("svg"), read = dlg.querySelector(".sk-read");
  const show = i => { if (!src || !read) return; const v = src.v ? src.v[i] : null;
    read.textContent = `${dates[i]}　` + (d ? `始 ${num(src.o[i], 1)}　高 ${num(src.h[i], 1)}　安 ${num(src.l[i], 1)}　終 ${num(src.c[i], 1)}${v != null ? `　出来高 ${num(v)}株` : ""}` : `終値 ${num(src.c[i], 1)}`); };
  if (svg && dates.length) {
    show(dates.length - 1);
    const bw = +svg.dataset.bw, L = +svg.dataset.l, SW = +svg.dataset.w, cur = svg.querySelector(".cur");
    svg.addEventListener("pointermove", ev => { const r = svg.getBoundingClientRect(), x = (ev.clientX - r.left) / r.width * SW;
      const i = Math.max(0, Math.min(dates.length - 1, Math.floor((x - L) / bw))); const cx = L + bw * (i + .5);
      cur.setAttribute("x1", cx); cur.setAttribute("x2", cx); cur.setAttribute("visibility", "visible"); show(i); });
    svg.addEventListener("pointerleave", () => { cur.setAttribute("visibility", "hidden"); show(dates.length - 1); });
  }
  dlg.querySelector(".sk-x").onclick = () => dlg.close();
  if (!dlg.open) dlg.showModal();
}
document.addEventListener("click", ev => {
  const b = ev.target.closest("button.stk");
  if (b) openStock(b.dataset.code, {entry: b.dataset.entry ? +b.dataset.entry : null, stop: b.dataset.stop ? +b.dataset.stop : null});
});
$("#stk").addEventListener("click", ev => { if (ev.target.id === "stk") ev.target.close(); });   // 外側を押すと閉じる

/* スマホのアプリとして使う: 電波が無いときは前回保存した内容で開く（sw.js） */
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
window.addEventListener("offline", showOffline);

(async () => {
  [T, V, PM] = await Promise.all([get("today.json"), get("validation.json"), get("postmortem.json")]);
  if (!T) $("#asof").textContent = "判定データがまだありません";
  renderToday(); renderFwd(); renderBt(); renderRule(); renderHold();
  [D, J, HY, M] = await Promise.all([get("diagnosis.json"), get("journal.json"), get("hypotheses.json"), get("manual.json")]);
  renderLearn(); renderManual();
  Q = await get("quotes.json"); renderHold();
  if (FROM_CACHE || !navigator.onLine) showOffline();   // 判定の表示で上書きされた後にもう一度付ける
})();
</script>
